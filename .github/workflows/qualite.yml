# Vérifie le portfolio à chaque envoi : erreurs JavaScript, règle de sécurité (CSP),
# accessibilité (axe), liens de partage, page 404, security.txt. Captures d’écran en pièce jointe.
name: Qualité

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # chaque lundi : vérifie que security.txt n’expire pas bientôt

permissions:
  contents: read

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions épinglées par empreinte de commit (une étiquette peut être déplacée, une empreinte non)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Outils de test (versions figées)
        run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.56.0 axe-core@4.10.2
      - name: Navigateur Chromium
        run: npx playwright install --with-deps chromium
      - name: Vérifications
        run: node tests/verifier.mjs
      - name: Captures d’écran
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captures
          path: tests/captures/
          retention-days: 14
          if-no-files-found: ignore
