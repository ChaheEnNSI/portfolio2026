 <g><rect x="116" y="66" width="38" height="17" rx="8" fill="#16100f"/><rect x="112" y="66" width="22" height="17" rx="7" fill="#16100f"/><path d="M112 72h-9" stroke="#16100f" stroke-width="3" stroke-linecap="round"/><ellipse cx="126" cy="74" rx="4" ry="4.5" fill="#344263"/><ellipse cx="144" cy="74" rx="4" ry="4.5" fill="#344263"/></g>
