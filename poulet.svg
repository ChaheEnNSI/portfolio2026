<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -12 236 234" width="236" height="234" role="img" aria-label="Un poulet à lunettes">
<style>
.po-body{transform-origin:50% 90%;animation:po-strut .5s ease-in-out infinite}
.po-wing{transform-origin:62% 40%;animation:po-flap .5s ease-in-out infinite}
.po-legL{transform-origin:top;animation:po-legL .5s ease-in-out infinite}
.po-legR{transform-origin:top;animation:po-legR .5s ease-in-out infinite}
.po-bawk{transform-origin:left center;animation:po-bawk 2s ease-in-out infinite;opacity:0}
@keyframes po-strut{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-7px) rotate(2.5deg)}}
@keyframes po-flap{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(16deg)}}
@keyframes po-legL{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-8deg)}}
@keyframes po-legR{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}}
@keyframes po-bawk{0%,55%,100%{opacity:0;transform:scale(.7)}62%{opacity:1;transform:scale(1)}85%{opacity:1}}
@media (prefers-reduced-motion:reduce){.po-body,.po-wing,.po-legL,.po-legR,.po-bawk{animation:none}.po-bawk{opacity:0}}
</style>
<ellipse cx="112" cy="205" rx="52" ry="7" fill="rgba(15,26,48,.12)"/>
<g class="po-legL"><path d="M96 168v26" stroke="#F0A52E" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M96 194l-9 7M96 194l9 7M96 194v8" stroke="#F0A52E" stroke-width="6" stroke-linecap="round" fill="none"/></g>
<g class="po-legR"><path d="M124 168v26" stroke="#E8942A" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M124 194l-9 7M124 194l9 7M124 194v8" stroke="#E8942A" stroke-width="6" stroke-linecap="round" fill="none"/></g>
<g class="po-body">
 <path d="M150 120c26-6 40 10 40 26s-18 20-30 14" fill="#F4C84B"/><path d="M172 128c14 2 20 14 16 26" fill="none" stroke="#E9A23B" stroke-width="3" stroke-linecap="round"/>
 <ellipse cx="108" cy="140" rx="60" ry="54" fill="#FFFFFF"/><path d="M60 150c-8 6-10 18-2 28 10-4 16-12 16-22" fill="#F7F2E7"/>
 <g class="po-wing"><path d="M118 120c30-4 44 14 40 36-16 10-40 8-52-8-6-12-2-24 12-28z" fill="#F7F2E7"/><path d="M150 132c8 4 12 14 10 24M138 128c6 5 9 15 7 25M126 127c5 6 7 16 5 24" stroke="#E2DBCD" stroke-width="2.6" stroke-linecap="round" fill="none"/></g>
